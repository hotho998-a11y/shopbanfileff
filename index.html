<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG TRUNG GIAN & QUẢN LÝ BẢO CHỨNG</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #232d42;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 60px;
        }

        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
        }

        .hero-section {
            padding: 35px 0;
            background: linear-gradient(180deg, #151c2c 0%, #0b0f19 100%);
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 30px;
        }

        .member-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.25s ease;
        }

        .member-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .avatar-box {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #232d42;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
        }

        .verified-tick {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background-color: var(--accent-blue);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border: 2px solid var(--card-bg);
        }

        .deposit-badge {
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-block;
        }

        .role-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .role-admin { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .role-gdv { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }

        .tag-skill {
            background: #232d42;
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: inline-block;
            margin: 2px;
        }

        .btn-zalo {
            background-color: #0068ff;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            padding: 8px;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-zalo:hover { color: white; opacity: 0.9; }
    </style>
</head>
<body>

    <!-- NAVBAR HEADER -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#"><i class="fas fa-shield-alt me-2"></i>CHECK-GDTG</a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Đăng nhập</button>
                <button class="btn btn-warning btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#registerModal">Đăng ký</button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="hero-section">
        <div class="container text-center">
            <h2 class="fw-bold text-warning">DANH SÁCH BẢO CHỨNG GIAO DỊCH</h2>
            <p class="text-secondary">Tra cứu danh tính và hạn mức bảo đảm chính thức</p>

            <div class="row justify-content-center mt-3">
                <div class="col-md-6">
                    <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary p-2" placeholder="Nhập tên, SĐT hoặc dịch vụ để tìm...">
                </div>
            </div>
        </div>
    </div>

    <!-- CONTAINER HIỂN THỊ DANH SÁCH THÀNH VIÊN -->
    <div class="container">
        <div class="row" id="memberList">
            <!-- Dữ liệu JS sẽ tự động tạo khung ở đây -->
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ DỮ LIỆU & RENDER -->
    <script>
        // CẤU HÌNH DANH SÁCH THÀNH VIÊN TẠI ĐÂY
        // Khi có thành viên thực tế mới, bạn chỉ cần thêm 1 dòng thông tin vào mảng bên dưới.
        const membersData = [
            {
                name: "Gia Bảo",
                role: "ADMIN TỔNG",
                roleClass: "role-admin",
                icon: "fa-crown",
                deposit: "2.500.000 VNĐ",
                phone: "0964703874 (SON GIA BAO)",
                zaloLink: "https://zalo.me/0964703874",
                skills: ["Acc FF", "File - Aim - Reg", "Trung Gian GDTG"]
            },
            {
                name: "Pham Tai",
                role: "ADMIN KỸ THUẬT",
                roleClass: "role-admin",
                icon: "fa-code",
                deposit: "3.000.000 VNĐ",
                phone: "0358482865",
                zaloLink: "https://zalo.me/0358482865",
                skills: ["Tool File", "Bot Zalo", "Kỹ Thuật Server"]
            }
            // Muốn thêm Giao dịch viên thực tế mới, bạn thêm vào dạng:
            // {
            //     name: "Tên GDV Thật",
            //     role: "GIAO DỊCH VIÊN",
            //     roleClass: "role-gdv",
            //     icon: "fa-user-check",
            //     deposit: "500.000 VNĐ",
            //     phone: "SĐT Chính Thức",
            //     zaloLink: "https://zalo.me/SĐT",
            //     skills: ["Dịch vụ 1", "Dịch vụ 2"]
            // }
        ];

        // Hàm vẽ giao diện động từ mảng dữ liệu
        function renderMembers() {
            const container = document.getElementById('memberList');
            container.innerHTML = membersData.map(m => `
                <div class="col-12 member-item">
                    <div class="member-card">
                        <div class="row align-items-center">
                            <div class="col-md-2 text-center mb-3 mb-md-0">
                                <div class="avatar-box">
                                    <div class="avatar-img"><i class="fas ${m.icon}"></i></div>
                                    <div class="verified-tick"><i class="fas fa-check"></i></div>
                                </div>
                                <span class="role-badge ${m.roleClass} mt-2 d-inline-block">${m.role}</span>
                            </div>
                            <div class="col-md-6 mb-3 mb-md-0">
                                <div class="d-flex align-items-center gap-2">
                                    <h4 class="text-warning fw-bold mb-0">${m.name}</h4>
                                    <i class="fas fa-check-circle text-primary"></i>
                                </div>
                                <div class="my-2">
                                    <span class="deposit-badge"><i class="fas fa-shield-alt me-1"></i>Hạn mức: ${m.deposit}</span>
                                </div>
                                <div>
                                    ${m.skills.map(s => `<span class="tag-skill">${s}</span>`).join('')}
                                </div>
                            </div>
                            <div class="col-md-4 border-start-md border-secondary ps-md-4">
                                <div class="small text-secondary">Zalo liên hệ:</div>
                                <div class="fw-bold text-info mb-2">${m.phone}</div>
                                <a href="${m.zaloLink}" target="_blank" class="btn-zalo"><i class="fas fa-comment me-1"></i>Liên hệ Zalo</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Chạy hàm render khi trang load xong
        document.addEventListener('DOMContentLoaded', renderMembers);

        // Chức năng tìm kiếm nhanh
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toLowerCase().trim();
            let items = document.querySelectorAll('.member-item');
            items.forEach(function(item) {
                let text = item.innerText.toLowerCase();
                item.style.display = text.includes(filter) ? '' : 'none';
            });
        });
    </script>
</body>
          </html>
