<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Gia Bảo - Acc Free Fire | Liên Quân | FC Mobile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #0f0f13;
      color: #e5e5e5;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */
    header {
      background: #16161d;
      border-bottom: 1px solid #2a2a35;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #00e5a0;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: #fff;
    }

    nav {
      display: flex;
      gap: 22px;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: #00e5a0;
    }

    .btn-nap {
      background: #00e5a0;
      color: #000;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s;
    }
